packages:
  - apps/*
  - packages/*

# Fail the install when a dependency wants to run install scripts that aren't
# listed in allowBuilds (pnpm 11's default), instead of skipping them silently.
strictDepBuilds: true

# Versions every app must agree on. Reference them as "catalog:".
catalog:
  '@hugeicons/core-free-icons': ^4.3.5
  '@hugeicons/react': ^1.1.10
  '@tailwindcss/vite': ^4.3.3
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.8
  '@types/node': ^24.19.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  happy-dom: ^21.0.4
  react: ^19.3.1
  react-aria-components: ^1.22.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  vite: ^8.3.5
  vitest: ^4.1.12
  zod: ^4.6.7

allowBuilds:
  # The root `prepare` script installs the git hooks instead: lefthook's own
  # postinstall is skipped by pnpm's side-effects cache after a CI install.
  lefthook: false
