packages:
  - apps/*
  - packages/*

# Fail the install when a dependency wants to run install scripts that aren't
# listed in allowBuilds (pnpm 11's default), instead of skipping them silently.
strictDepBuilds: true

# Versions every app must agree on. Reference them as "catalog:".
catalog:
  '@tailwindcss/vite': ^4.3.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  # 0.x and moving fast: pinned, so upgrades are deliberate.
  panelui-web: 0.8.0
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  vite: ^8.3.5
