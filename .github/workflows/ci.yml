name: CI

# Runs the repository checks on every pull request and every push to main.
# Pull requests from forks run with a read-only token and no secrets.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run still checking the old commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read # check out the code

jobs:
  # One job, so the main ruleset can require a single `checks` status. Once
  # dependencies are installed, every check runs even if an earlier one failed,
  # so a single run reports every problem.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version` input: it reads packageManager from the root package.json.
      # Must run before setup-node, whose pnpm cache calls `pnpm store path`.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      # The github format turns findings into annotations on the PR diff.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint --format=github

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      # The build regenerates committed files, such as the web app's
      # routeTree.gen.ts. A diff here means one of them is out of date.
      - name: Check generated files are committed
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: git diff --exit-code
