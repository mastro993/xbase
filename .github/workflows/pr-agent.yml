name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  # Split by event so a /ask comment cannot cancel an in-flight pull_request
  # review and leave the required check cancelled.
  group: pr-agent-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    name: PR-Agent review
    # Auto /review and /improve on non-draft, non-bot, same-repo PRs. All review
    # settings live in .pr_agent.toml. Collaborator `/review`, `/improve` or
    # `/ask …` comments re-run the job; that is the only way to review a fork
    # PR, because GitHub withholds secrets from fork runs. Other comments never
    # start the job.
    # Skipped jobs (drafts, bots, forks) count as passing for required checks.
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The action's own Dockerfile pulls a rolling tag, so pin the release image (0.48.0) by digest.
      - id: pr-agent
        uses: docker://pragent/pr-agent@sha256:80edef71baa3df28c129d858d4b53784abfc14704c235efb32b6c461d5399a6d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Gate only pull_request runs: issue_comment attaches to the default
      # branch and cannot satisfy the required check. Fail only when the review
      # is blocking (changes_required, or a security concern other than "No").
      # A missing merge_recommendation is non-blocking because PR-Agent reads
      # .pr_agent.toml from the default branch.
      - name: Fail on a blocking review
        if: github.event_name == 'pull_request'
        env:
          REVIEW: ${{ steps.pr-agent.outputs.review }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get("REVIEW", "").strip()
          if not raw:
              print("No review output; treating as non-blocking")
              sys.exit(0)
          try:
              review = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f"Could not parse review output ({exc}); treating as non-blocking")
              sys.exit(0)
          if not isinstance(review, dict):
              print("Review output is not an object; treating as non-blocking")
              sys.exit(0)

          merge = review.get("merge_recommendation")
          security = review.get("security_concerns")
          reasons = []
          if merge == "changes_required":
              reasons.append("merge_recommendation=changes_required")
          if security is not None and str(security).strip() != "No":
              reasons.append(f"security_concerns={security!r}")
          if reasons:
              print("Blocking review: " + "; ".join(reasons))
              sys.exit(1)
          print("Review is non-blocking")
          PY
