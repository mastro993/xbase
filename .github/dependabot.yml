version: 2

updates:
  # Pinned action SHAs and their version comments, in one weekly PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']

  # The root directory covers every workspace package in pnpm-workspace.yaml
  # and the single pnpm-lock.yaml. Minor and patch updates share one weekly PR,
  # except the UI stack's, which get a second one; each major update gets its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # What the BoardUI components in packages/ui build on. An update can change how
      # both apps look and behave, so check that PR in the browser, in light and dark.
      ui:
        update-types: [minor, patch]
        patterns:
          - react-aria-components
          - '@hugeicons/*'
          - tailwind-merge
          - tailwindcss
          - '@tailwindcss/*'
          - '@fontsource-variable/*'
      npm-minor-patch:
        update-types: [minor, patch]
