# Git hooks, installed by the root `prepare` script on `pnpm install`.
# Skip them once with `LEFTHOOK=0 git commit ...`.
pre-commit:
  piped: true # in order, stopping at the first failure: lint fixes first, then format
  jobs:
    # Warnings don't block a commit; CI fails on them.
    - name: lint
      glob: '*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
      run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: format
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
